name: deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Validate Maven project
        run: mvn --batch-mode validate

      - name: Compile Java source code
        run: mvn --batch-mode compile

      - name: Run tests
        run: mvn --batch-mode test

      - name: Package application
        run: mvn --batch-mode package

      - name: Verify WAR file
        run: |
          ls -lh target/
          test -f target/task-manager.war
          
      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn --batch-mode \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            verify \
            -Dsonar.projectKey=task-manager \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
          

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          set -eu

          WAR_FILE="target/task-manager.war"

          if [ ! -f "$WAR_FILE" ]; then
            echo "ERROR: WAR file was not generated."
            exit 1
          fi

          if [ -z "$TOMCAT_USER" ] || \
             [ -z "$TOMCAT_PASSWORD" ] || \
             [ -z "$TOMCAT_HOST" ]; then
            echo "ERROR: One or more Tomcat secrets are missing."
            exit 1
          fi

          TOMCAT_HOST="${TOMCAT_HOST%/}"

          curl --fail-with-body --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_HOST/manager/text/deploy?path=/task-manager&update=true"
